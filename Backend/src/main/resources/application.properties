server.port=${PORT:9090}
server.address=0.0.0.0

# Database Configuration (H2 Persistent File-based)
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:h2:file:./data/farmsync;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:sa}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:}
spring.datasource.driver-class-name=${SPRING_DATASOURCE_DRIVER_CLASS_NAME:org.h2.Driver}

# JPA / Hibernate Configuration
spring.jpa.hibernate.ddl-auto=${SPRING_JPA_HIBERNATE_DDL_AUTO:update}
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=${SPRING_JPA_PROPERTIES_HIBERNATE_DIALECT:org.hibernate.dialect.H2Dialect}

# Scaling & Performance (Connection Pooling)
spring.datasource.hikari.maximum-pool-size=${HIKARI_MAX_POOL_SIZE:4}
spring.datasource.hikari.minimum-idle=${HIKARI_MIN_IDLE:1}
spring.datasource.hikari.idle-timeout=300000
spring.datasource.hikari.max-lifetime=1200000
spring.datasource.hikari.connection-timeout=20000

# H2 Console Configuration
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console
spring.h2.console.settings.web-allow-others=true

# Security Configuration
farmsync.jwt.secret=${JWT_SECRET:farmsync_default_secret_key_32_characters_long}
firebase.config.path=${FIREBASE_CONFIG_PATH:firebase-service-account.json}

# Logging
logging.level.org.springframework.security=DEBUG
logging.level.com.farmsync=DEBUG

# OAuth2 Client Configuration
# Google OAuth2
spring.security.oauth2.client.registration.google.client-id=${GOOGLE_CLIENT_ID:google_client_id_placeholder}
spring.security.oauth2.client.registration.google.client-secret=${GOOGLE_CLIENT_SECRET:google_client_secret_placeholder}
spring.security.oauth2.client.registration.google.scope=profile,email

# Microsoft OAuth2 (Azure AD)
spring.security.oauth2.client.registration.microsoft.client-id=${MICROSOFT_CLIENT_ID:microsoft_client_id_placeholder}
spring.security.oauth2.client.registration.microsoft.client-secret=${MICROSOFT_CLIENT_SECRET:microsoft_client_secret_placeholder}
spring.security.oauth2.client.registration.microsoft.scope=openid,profile,email,offline_access
spring.security.oauth2.client.registration.microsoft.authorization-grant-type=authorization_code
spring.security.oauth2.client.registration.microsoft.redirect-uri={baseUrl}/login/oauth2/code/{registrationId}
spring.security.oauth2.client.provider.microsoft.authorization-uri=https://login.microsoftonline.com/common/oauth2/v2.0/authorize
spring.security.oauth2.client.provider.microsoft.token-uri=https://login.microsoftonline.com/common/oauth2/v2.0/token
spring.security.oauth2.client.provider.microsoft.jwk-set-uri=https://login.microsoftonline.com/common/discovery/v2.0/keys
spring.security.oauth2.client.provider.microsoft.user-name-attribute=name

# Frontend Base URL (for redirects)
farmsync.frontend.url=${FRONTEND_URL:http://localhost:5173}
