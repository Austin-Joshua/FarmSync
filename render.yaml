# Render Blueprint — connect this repo in Render → Blueprints → New Blueprint Instance.
# Both the Spring Boot backend and the FastAPI ML service are defined here.
# Set all sync:false env vars manually in the Render dashboard.

services:
  # ──────────────────────────────────────────────────────────────
  # 1. Spring Boot Backend
  # ──────────────────────────────────────────────────────────────
  - type: web
    name: farmsync-backend
    runtime: docker
    dockerfilePath: ./Dockerfile
    dockerContext: .
    plan: free
    envVars:
      - key: PORT
        value: 9090
      - key: JWT_SECRET
        sync: false
      - key: FRONTEND_URL
        sync: false
      - key: ML_SERVICE_URL
        # Set to the live Render URL of farmsync-ml below, e.g.: https://farmsync-ml.onrender.com
        sync: false
      - key: ML_SERVICE_SECRET
        sync: false
      - key: SPRING_DATASOURCE_URL
        sync: false
      - key: SPRING_DATASOURCE_USERNAME
        sync: false
      - key: SPRING_DATASOURCE_PASSWORD
        sync: false
      - key: FIREBASE_SERVICE_ACCOUNT_JSON
        sync: false
      - key: SPRING_PROFILES_ACTIVE
        value: prod
      - key: SEED_DEMO_DATA
        value: "false"

  # ──────────────────────────────────────────────────────────────
  # 2. FastAPI ML Service
  # ──────────────────────────────────────────────────────────────
  - type: web
    name: farmsync-ml
    runtime: docker
    dockerfilePath: ./ml-service/Dockerfile
    dockerContext: ./ml-service
    plan: free
    envVars:
      - key: ML_PORT
        value: 8000
      - key: ML_SERVICE_SECRET
        # Must match ML_SERVICE_SECRET set on farmsync-backend above
        sync: false
      - key: FRONTEND_URL
        sync: false
