name: Frontend CI

on:
  push:
    branches: [ main, develop ]
    paths:
      - 'Frontend/**'
  pull_request:
    branches: [ main ]
    paths:
      - 'Frontend/**'

jobs:
  test:
    name: Lint, Typecheck & Test Frontend
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: Frontend/package-lock.json

      - name: Install dependencies
        working-directory: Frontend
        run: npm ci

      - name: Run TypeScript typecheck
        working-directory: Frontend
        run: npm run typecheck

      - name: Verify i18n locale files match template schema
        working-directory: Frontend
        run: python src/test/verify_locales.py

      - name: Run linter
        working-directory: Frontend
        run: npm run lint

      - name: Run tests
        working-directory: Frontend
        run: npm run test
